#=== start & end macros ===

[gcode_macro START_PRINT]
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(40)|float %}
  {% set BED_TYPE = params.BED_TYPE|default("High Temp Plate") %}
  {% set RUN_ACCEL = printer.configfile.settings['printer'].max_accel|int %}
# fresh state
  CLEAR_PAUSE
  COOL_BED_CANCEL
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_state VALUE=0
  M117 ; clear display
  RESPOND MSG="3D model received. Printing initiated."
# prepare
  SET_FILAMENT_SENSOR SENSOR=jam_sensor ENABLE=0 ; disable jam sensor
  SET_GCODE_OFFSET Z=0 ; reset Z offset
  SET_FAN_SPEED FAN=air_purifier SPEED=0.6 ; air_purifier ON
# preheating
  M104 S{EXTRUDER_TEMP*0.8}
  M140 S{BED_TEMP}
# chamber heating
  {% set CHAMBER_TEMP = printer["gcode_macro _CHAMBER_HEAT"].target %}
  {% if CHAMBER_TEMP > 35 %}
    SET_FAN_SPEED FAN=bed_fan SPEED=1
  {% endif %}
# homing
  CG28
  Z_TILT_ADJUST
  QUICK_CLEAN_NOZZLE
# cool down
  M106 P2 S205 ; set side_fan to 80%
  G1 X300 Y150 F21000 ; park next to side fan
  M109 S150 ; cool nozzle to 150°C to reduce oozing
  M107
  M107 P2
  G1 X150 Y150 F21000
  M190 S{BED_TEMP} ; wait for bed temperature before next step
# second home
  G1 Z3 F300
# touch_model by bed_type
  {% if BED_TYPE == "Textured PEI Plate" %}
        CARTOGRAPHER_TOUCH_MODEL LOAD=pei_textured
    {% else %}
        CARTOGRAPHER_TOUCH_MODEL LOAD=default
    {% endif %}
  CARTOGRAPHER_TOUCH_HOME
  M104 S{EXTRUDER_TEMP} ; reheat nozzle
# meshing
  SET_VELOCITY_LIMIT ACCEL=2000 ; drop accels to prevent hyper agressive meshing
  BED_MESH_CLEAR ; clear current mesh
  G4 P1000 ; wait required to prevent MCU overload
  BED_MESH_CALIBRATE ADAPTIVE=1 ; start bedmesh calibrate
  SET_VELOCITY_LIMIT ACCEL={RUN_ACCEL}
# printing
  SMART_PARK ; park the printhead near the print area
  M1090 S{EXTRUDER_TEMP} ; stabilize nozzle temperature before next step
  LINE_PURGE ; create purge line near the print area of the part
  SKEW_PROFILE LOAD=calilantern ; use skew_profile
  UPDATE_DELAYED_GCODE ID=_ENABLE_JAM_SENSOR DURATION=5 ; enable jam sensor in 5s
  ENABLE_AI_MONITOR

[gcode_macro END_PRINT]
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set retract = client.cancel_retract | default(5.0) | float %}
  DISABLE_AI_MONITOR
  M117 Print finished
  _CLIENT_RETRACT LENGTH={retract}
  _TOOLHEAD_PARK_PAUSE_CANCEL Y=150
  TIMELAPSE_TAKE_FRAME ; timelapse
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_state VALUE=0
  #cool down hotend, bed and chamber
  M141 ; chamber OFF
  COOL_BED
  COOL_DOWN
  UPDATE_DELAYED_GCODE ID=PURIFIER_OFF DURATION=900 ; air_purifier delayed OFF
  # clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

[gcode_macro CG28]
description: Conditional homing
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

[gcode_macro QUICK_CLEAN_NOZZLE]
gcode:
  {% set TARGET_TEMP = printer.extruder.target %}
  CG28
# move nozzle to cleaning position
  G1 X130 Y303 Z2
  M109 S{TARGET_TEMP} ; wait for 0,8 of extruder temp
  M104 S150 ; start cooling to 150°C
  M106 S255  ; set nozzle fan to max
  M400 ; wait for moves to finish
# clean nozzle
  G1 Z0 F300
  G1 X170 F300 ; wipe nozzle on the bed
  G1 X180 Z0.5 F21000 ; break a string
  G1 Z20 F300

[delayed_gcode _ENABLE_JAM_SENSOR]
gcode:
  SET_FILAMENT_SENSOR SENSOR=jam_sensor ENABLE=1

#=== filament load/unload macros ===

[gcode_macro LOAD_FILAMENT]
description: Load filament into hotend
gcode:
  {% if not printer.pause_resume.is_paused %}
    RESPOND TYPE=command MSG="action:prompt_begin Load filament:"
    RESPOND TYPE=command MSG="action:prompt_button PLA/TPU (220°C)|_LOAD TEMPERATURE=220|secondary"
    RESPOND TYPE=command MSG="action:prompt_button PETG/ABS/PA (250°C)|_LOAD TEMPERATURE=250|secondary"
    RESPOND TYPE=command MSG="action:prompt_button PC/PPS (300°C)|_LOAD TEMPERATURE=300|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button EXIT|RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    _LOAD
  {% endif %}

[gcode_macro _LOAD_FILAMENT_PROMPT]
gcode:
  {% if not printer["gcode_macro M600"].m600_state %}
    RESPOND TYPE=command MSG="action:prompt_begin Filament inserted!"
    RESPOND TYPE=command MSG="action:prompt_button PLA/TPU (220°C)|_LOAD TEMPERATURE=220|secondary"
    RESPOND TYPE=command MSG="action:prompt_button PETG/ABS/PA (250°C)|_LOAD TEMPERATURE=250|secondary"
    RESPOND TYPE=command MSG="action:prompt_button PC/PPS (300°C)|_LOAD TEMPERATURE=300|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button EXIT|RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Filament inserted!"
    RESPOND TYPE=command MSG="action:prompt_button LOAD|_LOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button EXIT|RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _LOAD]
gcode:
  SAVE_GCODE_STATE NAME=state_preload
  {% set EXTRUDE_LENGTH = params.EXTRUDE_LENGTH|default(80)|float %}
  {% set EXTRUDE_SPEED = params.EXTRUDE_SPEED|default(5)|float %}
  {% set RETRACT_LENGTH = params.RETRACT_LENGTH|default(2)|float %}
  {% set TEMPERATURE = printer["gcode_macro RESUME"].last_extruder_temp.temp|float if printer["gcode_macro RESUME"].last_extruder_temp.restore
                  else params.TEMPERATURE|default(220)|float %}
  SET_FILAMENT_SENSOR SENSOR=jam_sensor ENABLE=0 ; disable jam sensor
  RESPOND MSG="Heating up..."
  M109 S{TEMPERATURE}
  RESPOND MSG="Purging..."
  M83
  G1 E{EXTRUDE_LENGTH} F{EXTRUDE_SPEED * 60}
  G1 E-{RETRACT_LENGTH} F{EXTRUDE_SPEED * 60}
  M400
  {% if printer["gcode_macro M600"].m600_state != 1 %} M109 S0 {% endif %} ; hotend OFF (unless M600 active)
  RESPOND MSG="Filament loaded"
  SET_FILAMENT_SENSOR SENSOR=jam_sensor ENABLE=1 ; enable jam sensor
  RESTORE_GCODE_STATE NAME=state_preload MOVE=1

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from hotend
gcode:
  {% if not printer.pause_resume.is_paused %}
    RESPOND TYPE=command MSG="action:prompt_begin Unload filament:"
    RESPOND TYPE=command MSG="action:prompt_button PLA/TPU (220°C)|_UNLOAD TEMPERATURE=220|secondary"
    RESPOND TYPE=command MSG="action:prompt_button PETG/ABS/PA (250°C)|_UNLOAD TEMPERATURE=250|secondary"
    RESPOND TYPE=command MSG="action:prompt_button PC/PPS (300°C)|_UNLOAD TEMPERATURE=300|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button EXIT|RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    _UNLOAD
  {% endif %}

[gcode_macro _UNLOAD]
gcode:
  SAVE_GCODE_STATE NAME=state_preunload
  {% set TEMPERATURE = printer["gcode_macro RESUME"].last_extruder_temp.temp|float if printer["gcode_macro RESUME"].last_extruder_temp.restore
                  else params.TEMPERATURE|default(220)|float %}
  SET_FILAMENT_SENSOR SENSOR=jam_sensor ENABLE=0 ; disable jam sensor
  RESPOND MSG="Heating up..."
  M109 S{TEMPERATURE}
  RESPOND MSG="Unloading filament..."
  M83
  G1 E10 F300
  G1 E-15 F3000
  G1 E-22.47 F2400
  G1 E-6.42 F1200
  G1 E-3.21 F720
  G1 E5 F356
  G1 E-5 F384
  G1 E5 F412
  G1 E-5 F440
  G1 E5 F467
  G1 E-5 F495
  G1 E5 F523
  G1 E-25 F3000
  M400
  M109 S0 ; hotend OFF
  RESPOND MSG="Unloading filament completed"
  SET_FILAMENT_SENSOR SENSOR=jam_sensor ENABLE=1 ; enable jam sensor
  RESTORE_GCODE_STATE NAME=state_preunload MOVE=1

#=== additional M codes ===

[gcode_macro M106]
description: Set fan speed. P0 for part, P2 for auxiliary, P3 for chamber ; P3 turned to temperature_fan.
gcode:
  {% set fan_map = {0: "part_fan", 2: "side_fan", 3: "chamber_fan"} %}
  {% set fan_id = params.P|default(0)|int %}
  {% set fan = fan_map[fan_id] %}
  {% set speed_param = params.S|default(255)|int %}
  {% if speed_param > 0 %}
    {% set speed = (speed_param|float / 255) %}
  {% else %}
    {% set speed = 0 %}
  {% endif %}
  SET_FAN_SPEED FAN={fan} SPEED={speed}

[gcode_macro M107]
description: Set fan off. P0 for part, P2 for auxiliary, P3 for chamber ; P3 turned to temperature_fan.
gcode:
  {% set fan_map = {0: "part_fan", 2: "side_fan", 3: "chamber_fan"} %}
  {% set fan_id = params.P|default(0)|int %}
  {% set fan = fan_map[fan_id] %}
  SET_FAN_SPEED FAN={fan} SPEED=0

[gcode_macro M109]
description: Wait for the hotend temp before proceeding (does not wait to stabilize)
rename_existing: M1090
gcode:
  {% set s = params.S|default(0)|float %}
  {% set current = printer.extruder.temperature %}
  M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; set hotend temp
  {% if s != 0 %}
    {% if s < current %}
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={s+1} ; wait for hotend temp to cool down
    {% else %}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} ; wait for hotend temp to heat up
    {% endif %}
  {% endif %}

[gcode_macro M190]
description: Wait for the bed temp before proceeding (does not wait to stabilize)
rename_existing: M1900
gcode:
  {% set s = params.S|default(0)|float %}
  {% set current = printer.heater_bed.temperature %}
   M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; set bed temp
  {% if s != 0 %}
    {% if s < current %}
      TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={s+1} ; wait for bed temp to cool down
    {% else %}
      TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} ; wait for bed temp to heat up
    {% endif %}
  {% endif %}

#=== chamber heater macros ===

[gcode_macro _CHAMBER_HEAT]
variable_target: 0
gcode:
  {% set T = params.TEMP|default(0)|int %}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_HEAT VARIABLE=target VALUE={T}
  RESPOND MSG="Chamber heater target {T}°C"
  UPDATE_DELAYED_GCODE ID=_CHAMBER_LOOP DURATION=5

[delayed_gcode _CHAMBER_LOOP]
gcode:
  {% set target = printer["gcode_macro _CHAMBER_HEAT"].target %}
  {% if target > 0 %}
    {% set current = printer["temperature_sensor chamber_temp"].temperature %}
    {% if current < target %}
      SET_FAN_SPEED FAN=bed_fan SPEED=1
    {% elif current > (target + 0.5) %}
      SET_FAN_SPEED FAN=bed_fan SPEED=0
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_CHAMBER_LOOP DURATION=5
  {% else %}
    SET_FAN_SPEED FAN=bed_fan SPEED=0
    UPDATE_DELAYED_GCODE ID=_CHAMBER_LOOP DURATION=0
  {% endif %}

[gcode_macro M141]
description: Chamber cool down
gcode:
  _CHAMBER_HEAT TEMP=0

[gcode_macro M191]
description: Set chamber heater target (max 60°C)
gcode:
  {% set s = [params.S|default(60)|float, 60] | min %}
  SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={s}
  _CHAMBER_HEAT TEMP={s}

#=== additional end macros ===

[gcode_macro COOL_DOWN]
description: Cool down the hotend - best next to the side fan
gcode:
  M106 S205 ; set part_fan to 80%
  M106 P2 S205 ; set side_fan to 80%
  {% if printer.extruder.temperature > 150 %}
  M109 S150 ; cool nozzle to 150°C to reduce oozing
  {% endif %}
  M104 S0 ; hotend to 0
  M107
  M107 P2

[gcode_macro COOL_BED]
description: Slowly cool down the bed to a target temperature.
gcode:
    {% set target   = params.TARGET|default(45)|float %}
    {% set step     = params.STEP|default(2)|float %}
    {% set interval = params.INTERVAL|default(90)|float %}
    {% set current  = printer.heater_bed.temperature %}

    {% if current > target %}
        {% set new_temp = [current - step, target]|max %}
        M140 S{new_temp}
        M117 Bed cool down: {new_temp|round(1)}C -> {target}C
        UPDATE_DELAYED_GCODE ID=_COOL_BED_STEP DURATION={interval}
    {% else %}
        M140 S0
        M117 Print finished
        COOL_BED_CANCEL
    {% endif %}

[delayed_gcode _COOL_BED_STEP]
gcode:
    COOL_BED

[gcode_macro COOL_BED_CANCEL]
gcode:
    UPDATE_DELAYED_GCODE ID=_COOL_BED_STEP DURATION=0

[delayed_gcode PURIFIER_OFF]
gcode:
  SET_FAN_SPEED FAN=air_purifier SPEED=0
  UPDATE_DELAYED_GCODE ID=PURIFIER_OFF DURATION=0

#=== carto adjustments ===

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST ; turn off the bed heater while adjusting the Z tilt
gcode:
  {% set RUN_ACCEL = printer.configfile.settings['printer'].max_accel|int %}
  {% set TARGET_TEMP = printer.heater_bed.target %}
  SET_VELOCITY_LIMIT ACCEL=2000
  M140 S0
  _Z_TILT_ADJUST
  M140 S{TARGET_TEMP}
  SET_VELOCITY_LIMIT ACCEL={RUN_ACCEL}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE ; turns off the bed heater while scanning
gcode:
  {% set TARGET_TEMP = printer.heater_bed.target %}
  M140 S0
  _BED_MESH_CALIBRATE {rawparams}
  M140 S{TARGET_TEMP}

#=== PID macros ===

[gcode_macro PID_BED]
description: Start bed PID
gcode:
  CG28
  G1 X150 Y150 Z20
  PID_CALIBRATE HEATER=heater_bed TARGET={params.BED_TEMP|default(45)}
  TURN_OFF_HEATERS
  SAVE_CONFIG

[gcode_macro PID_HOTEND]
description: Start hotend PID
gcode:
  CG28
  G1 X150 Y150 Z20
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET={params.HOTEND_TEMP|default(250)}
  COOL_DOWN
  SAVE_CONFIG

#=== warmup ===

[gcode_macro WARMUP]
description: Stress test
variable_maxd: 14142.14 ; = SQRT(2*maxy)
gcode:
  {% set min_loops = 2 %}
  {% set max_loops = params.LOOPS|default(3)|int %}
  {% if 'LOOPS' in params|upper %}
    {% if max_loops < min_loops %}
      {% set max_loops = min_loops %}
    {% endif %}
  {% endif %}
  {% set loop_cnt = max_loops %}
  {% set maxx = params.X_ACCEL_MAX|default(12000)|int %}
  {% set maxy = params.Y_ACCEL_MAX|default(12000)|int %}
  {% set max_x = (printer.toolhead.axis_maximum.x|int-5) %}
  {% set max_y = (printer.toolhead.axis_maximum.y|int-5) %}
  {% set loop_step_y = max_y//(loop_cnt-1) %}
  {% set loop_step_x = max_x//(loop_cnt-1) %}
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  CG28
  SET_VELOCITY_LIMIT ACCEL={maxx}
  {% for number in range(10,max_y+11,loop_step_y) %}
    {% if number >= max_y %}
    {% set number = max_y %}
    {% endif %}
    G1 F{maxy} X10 Y{number}
    G1 F{maxx} X{max_x} Y{number}
  {% endfor %}
  SET_VELOCITY_LIMIT ACCEL={maxy}
  {% for number in range(10,max_x+11,loop_step_y) %}
    {% if number >= max_x %}
    {% set number = max_x %}
    {% endif %}
    G1 F{maxy} X{number} Y{max_y}
    G1 F{maxy} X{number} Y10
  {% endfor %}
  SET_VELOCITY_LIMIT ACCEL={maxd}
  {% for times in range(loop_cnt) %}
    G1 F{maxx} X10 Y10
    G1 F{maxd} X{max_x} Y{max_y}
    G1 F{maxx} X10 Y{max_y}
    G1 F{maxd} X{max_x} Y10
    G1 F{maxy} X{max_x} Y{max_y}
    G1 F{maxd} X10 Y10
    G1 F{maxy} X10 Y{max_y}
    G1 F{maxd} X{max_x} Y10
  {% endfor %}
  SET_VELOCITY_LIMIT ACCEL={maxx}
  {% for times in range(loop_cnt) %}
    G1 F{maxy} X10 Y10
    G1 F{maxy} X10 Y{max_y}
    G1 F{maxx} X{max_x} Y{max_y}
    G1 F{maxy} X{max_x} Y10
    G1 F{maxx} X10 Y10
    G1 F{maxx} X{max_x} Y10
    G1 F{maxy} X{max_x} Y{max_y}
    G1 F{maxx} X10 Y{max_y}
  {% endfor %}
  G1 X{x_park} Y{y_park} F18000